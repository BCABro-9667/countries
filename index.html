<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Countries Explorer | Discover World Countries with Detailed Information</title>
    <meta name="description" content="Explore comprehensive information about all countries worldwide. Get details on population, capital cities, currencies, languages, and more with our interactive country explorer.">
    <meta name="keywords" content="countries, world countries, country information, geography, capitals, population, flags">
    <meta name="author" content="Avdhesh Kumar">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2b3945" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com/">
    <meta property="og:title" content="Countries Explorer | Discover World Countries">
    <meta property="og:description" content="Explore comprehensive information about all countries worldwide with detailed facts and statistics.">
    <meta property="og:image" content="https://yourwebsite.com/images/social-preview.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://yourwebsite.com/">
    <meta name="twitter:title" content="Countries Explorer | Discover World Countries">
    <meta name="twitter:description" content="Explore comprehensive information about all countries worldwide with detailed facts and statistics.">
    <meta name="twitter:image" content="https://yourwebsite.com/images/social-preview.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourwebsite.com/">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Countries Explorer",
      "description": "Interactive application for exploring world countries information",
      "url": "https://yourwebsite.com/",
      "applicationCategory": "Education",
      "operatingSystem": "Web",
      "creator": {
        "@type": "Person",
        "name": "Avdhesh Kumar"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Noscript fallback -->
    <noscript>
      <div style="text-align: center; padding: 2rem; background: #f8f9fa; color: #212529;">
        <h1>Countries Explorer</h1>
        <p>This application requires JavaScript to function properly. Please enable JavaScript in your browser to continue.</p>
        <p>Alternatively, you can visit <a href="https://restcountries.com/" target="_blank" rel="noopener">REST Countries API</a> for country information.</p>
      </div>
    </noscript>
  </body>
</html>
